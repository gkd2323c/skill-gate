name: build

# 每次提交都构建安装包（产物保留 7 天，不发布）；
# 只有推送 v* 标签时才创建 Release —— 版本号由 manifest.json 决定，标签只用来定点。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pack
        run: node scripts/pack.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: dist/*
          retention-days: 7

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/app-*.zip dist/app-*.entry.json
